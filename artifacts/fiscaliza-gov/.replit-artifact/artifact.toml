kind = "web"
previewPath = "/"
title = "FISCALIZA.GOV"
version = "1.0.0"
id = "artifacts/fiscaliza-gov"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18831

[services.development]
run = "pnpm --filter @workspace/fiscaliza-gov run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fiscaliza-gov", "run", "build" ]
publicDir = "artifacts/fiscaliza-gov/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18831"
BASE_PATH = "/"
